name: Regenerate React DOM lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/react-dom-19-3-alignment
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Align React DOM runtime and types
        run: |
          pnpm add -w react-dom@^19.3.0
          pnpm add -Dw @types/react-dom@^19.3.0

      - name: Verify frozen install and repository
        run: |
          rm -rf node_modules .next
          pnpm install --frozen-lockfile
          pnpm verify

      - name: Commit regenerated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes were produced."
            exit 1
          fi
          git commit -m "fix: align React DOM runtime and types [lockfile-bot]"
          git push origin HEAD:fix/react-dom-19-3-alignment
